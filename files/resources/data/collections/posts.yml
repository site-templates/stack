# Column types for posts.json — the source of truth the builder reads:
# richtext columns open in the rich editor (Content drawer and any section
# repeater listing this collection).
fields:
    title: { type: text }
    slug: { type: text }
    description: { type: textarea }
    dateFormatted: { type: text }
    readTime: { type: text }
    image: { type: image }
    imageAlt: { type: text }
    link: { type: url }
    content: { type: richtext }
