title: Masthead
description: The editorial introduction — a serif greeting, a short bio, social links, and the fade-out portrait
fields:
    greeting:
        type: text
        label: Greeting
        default: "Hi, I'm Elliot."
    statement:
        type: textarea
        label: Statement
        rows: 3
        default: "I build software with a strong bias for design and clarity."
    bio:
        type: textarea
        label: Bio
        rows: 3
        default: "I work where design systems meet product engineering. This site is where I write it down."
    bioTwo:
        type: textarea
        label: Second bio paragraph
        rows: 3
        default: ""
    company:
        type: text
        label: Company
        default: "Northwind"
    location:
        type: text
        label: Location
        default: "Portland, Oregon"
    portrait:
        type: image
        label: Portrait
        default: "/images/portrait.webp"
    portraitAlt:
        type: text
        label: Portrait alt text
        default: "Black-and-white portrait of Elliot Hayes"
    showPortrait:
        type: toggle
        label: Show the portrait
        default: "1"
    showSocial:
        type: toggle
        label: Show social links
        default: "1"
    links:
        type: repeater
        label: Social links
        source: site.social
        add_button_label: "Add link"
        item_label: label
        sub_fields:
            label:
                type: text
                label: Label
                default: "New link"
            icon:
                type: select
                label: Icon
                default: "email"
                options:
                    email: Email
                    github: GitHub
                    linkedin: LinkedIn
                    x: X
                    instagram: Instagram
                    youtube: YouTube
                    rss: RSS
            url:
                type: url
                label: Link
                default: "#"
